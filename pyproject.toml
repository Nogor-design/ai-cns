[project]
name = "cortex-lite"
version = "1.2.0"
description = "AI-CNS Cortex-Lite: a local memory-and-context layer for working across many projects with many models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cortex = "cortex.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
